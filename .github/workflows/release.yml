name: Release

# Publishes a GitHub release carrying the APK committed at dist/Bible.apk,
# which is the build that was tested. Runs when a tag such as v1.0.0 is
# pushed, or when started by hand with the tag to create.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release, such as v1.0.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag and the bundled APK agree
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag must look like v1.0.0, not '${TAG}'." >&2
            exit 1
          fi
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          version="$("$aapt2" dump badging dist/Bible.apk \
            | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          if [ "v${version}" != "${TAG}" ]; then
            echo "dist/Bible.apk is version ${version}, but the tag is ${TAG}." >&2
            exit 1
          fi
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/Bible.apk "Bible-${TAG}.apk"
          {
            echo "Offline Bible reader for Android 6.0 and later. Download the APK below and open it on your phone to install."
            echo
            # This version's section of the changelog, without its heading.
            awk -v heading="## ${TAG#v}" '
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          } > notes.md
          # Creates the tag at this commit if it does not exist yet.
          gh release create "${TAG}" "Bible-${TAG}.apk" \
            --target "${GITHUB_SHA}" \
            --title "Bible ${TAG}" \
            --notes-file notes.md
